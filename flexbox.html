<!DOCTYPE html>
<html>
<head>
<title>Food Corner</title>
<style>
body{
  font-family: Arial;
  background:#d3d3d3;
  margin:0;
}

header{
  background:#e2741f;
  color:white;
  padding:20px;
  text-align: center;
}
/* MENU SECTION */

.menu{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:40px;
  flex-wrap:wrap;
}

/* FOOD CARD */
.item{
  display:flex;
  align-items:center;
  background:white;
  width:320px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}

/* IMAGE */

.item img{
  width:80px;
  height:80px;
  object-fit:contain;
}

/* TEXT */
.food-text{
  margin-left:20px;
}

.food-text h3{
  margin:0;
}

.food-text p{
  margin:5px 0 0 0;
  color:#555;
}

</style>

</head>

<body>

<header>
<h1>Food Corner</h1>
</header>

<section class="menu">

<div class="item">
<img src="assets/pizzaa22.jpg">
<div class="food-text">
<h3>Pizza</h3>
<p>Cheesy delicious pizza</p>
</div>
</div>

<div class="item">
<img src="assets/burger.png">
<div class="food-text">
<h3>Burger</h3>
<p>Juicy beef burger</p>
</div>
</div>

<div class="item">
<img src="assets/juice.jfif">
<div class="food-text">
<h3>Juice</h3>
<p>pineApple Juice</p>
</div>
</div>

<div class="item">
<img src="assets/donut.jfif">
<div class="food-text">
<h3>Donut</h3>
<p>Delicious glazed donut</p>
</div>
</div>


</section>

</body>
</html>
