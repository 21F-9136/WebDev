<!DOCTYPE html>
<html>
<head>
<title>Grid Layout</title>
<style>
body{
  margin:0;
}
.grid-item1 { grid-area: header; }
.grid-item2 { grid-area: menu; }
.grid-item3 { grid-area: main; }
.grid-item4 { grid-area: footer; }

.grid-container {
  display: grid;
  grid-template-columns: 200px 1fr 1fr 1fr 1fr;
  grid-template-rows: 80px 1fr 80px;
  grid-template-areas:
    "header header header header header"
    "menu main main main main"
    "menu footer footer footer footer";
  background-color: MediumSeaGreen;
  padding: 10px;
  height: 100vh;
}
.grid-container div {
  background-color: #c9d9d9;
  text-align: center;
  padding: 20px;
  border: 3px solid rgb(223, 111, 223);
  font-size: 20px;
}
</style>
</head>
<body>
<div class="grid-container">
  <div class="grid-item1">Header </div>
  <div class="grid-item2">Menu</div>

  <div class="grid-item3">
    <h2>Welcome to My Website</h2>
  <p>This is the main content area.</p>

  <h3>Our Services</h3>
  <p>We provide web development and design services.</p>

  </div>

  
  <div class="grid-item4">Footer</div>
</div>

</body>
</html>
