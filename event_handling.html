<!DOCTYPE html>
<html>
<head>
  <title>Story</title>
  <style>
    .dark { background: black; color: white; }
  </style>
</head>

<body>

<h2>The Basement</h2>

<p id="story">I went to find my friend in the basement.</p>

<button onclick="darkMode()">Dark Mode</button><br>

Enter your name: <input id="name"><br><br>

<button onclick="warn()">Click Me</button>


<script>
  function darkMode() {
    document.body.className = "dark";
  }

  function warn() {
    var n = document.getElementById("name").value;
    alert("Don't click again " + n);
  }


</script>

</body>
</html>
